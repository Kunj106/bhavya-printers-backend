spring.application.name=bhavya-printers-backend

# Database (MySQL)
# Update YOUR_MYSQL_PASSWORD below before running
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

server.port=${PORT:8080}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#  Server
server.servlet.context-path=/api

#  Settings file
app.settings.path=${user.dir}/data/settings.json

#  Notifications
# Set to true to enable SMS + WhatsApp notifications
notification.enabled=true

# Fast2SMS  free Indian SMS API (https://www.fast2sms.com)
# Sign up free Dev API  copy your API key paste below
notification.fast2sms.api-key=udNtZDWPz9oQCEUbraqI7KS5pVj6if8XghFywBcO1AlmTv2JMxlKroRMEhJdqUGAWCtHc79Zu5fTg0se

# Meta WhatsApp Business Cloud API (free 1000 conversations/month)
# Setup: https://developers.facebook.com  Create App  WhatsApp Getting Started
# Copy Phone Number ID and Temporary Access Token from the dashboard
notification.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
notification.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}

#  Logging
logging.level.com.bhavyaprinters=INFO
logging.level.org.springframework.web=WARN

#  Google OAuth (optional)
# Set your Google Cloud OAuth Client ID (from console.cloud.google.com)
# The frontend reads VITE_GOOGLE_CLIENT_ID from .env
# For admin Google login: set this to the Google email of the admin account
#  Google OAuth — used to verify Google ID tokens from the frontend
# (audience + email checks). No client secret needed for this flow.
google.client.id=${GOOGLE_CLIENT_ID:}
google.admin.email=${GOOGLE_ADMIN_EMAIL:}


logging.level.org.hibernate.SQL=DEBUG


logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.jpa.generate-ddl=true

brevo.api.key=${BREVO_API_KEY}

# RazorPay Details :
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}